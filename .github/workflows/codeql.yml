# CodeQL static analysis for Java with the security-extended suite (docs/spec.md, section 14.2).
name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "27 3 * * 2" # weekly, Tuesday 03:27 UTC

permissions: {}

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      MAVEN_OPTS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 and JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build
        run: ./mvnw -B -ntp compile -Dspotless.check.skip=true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
